name: coursebook
version: 0.1.0
description: >-
  Coursebook is a native Hermes Desktop learning workspace. It turns a goal or a reusable course
  pack into a governed, resumable sequence of lessons: one objective at a time, typed checks,
  bounded grading, transactional transitions, inspectable evidence, and sourced visuals/audio.
  Parent Studio prepares parent-led lesson packs; children do not chat with Coursebook.
author: DeseretSaint
homepage: https://github.com/DeseretSaint/hermes-classroom
manifest_version: 2
requires_hermes: ">=0.23.0"
tags:
  - learning
  - education
  - courses
  - evidence
  - desktop

# Declared, and registered by __init__.py. An undeclared registration fails admission.
provides_tools:
  - coursebook_status
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_tool_call

# Validated and surfaced only; Hermes never auto-installs these. The grader path validates
# structured output locally, so a missing jsonschema must not silently accept invalid JSON.
python_dependencies:
  - "jsonschema>=4.0,<5"
  # Coursebook's own local recogniser for pronunciation practice (M3-B1). Optional at runtime:
  # a missing import/model/ffmpeg is reported as practice-only/unavailable, never a score. No
  # provider key is read and `stt.provider` is never touched.
  - "faster-whisper>=1.0,<2"
  # Student syllabus import: PDF text extraction only. Optional at runtime — when it is absent,
  # `syllabus.intake.create` answers PARSER_UNAVAILABLE (a typed refusal) rather than guessing.
  # The range must overlap the host's core `documents` pin (pypdf==6.x) or plugin admission refuses
  # the whole plugin; this was the live enable blocker on 2026-11-07.
  - "pypdf>=4.0,<7"

# No requires_env in the skeleton: Coursebook stores no secrets. Every key below has a reader
# wired in this build (`coursebook/tools.py::configure` <- `ctx.get_config`); a settings field
# nothing reads would be a partially wired control, so the schema and the reader move together.
config_schema:
  status_include_contracts:
    type: bool
    default: true
    description: >-
      Include the frozen-contract inventory summary (contract count, implemented method count,
      error-code count) in the coursebook_status tool output. Read by coursebook.tools.
  validator_model:
    type: string
    default: ""
    description: >-
      Host-configured second model used only for the independent validation pass (for example a
      different model from the one that writes plans and lessons). Read by __init__.py and passed
      to ctx.llm.complete_structured(model=...). Empty means no cross-model path exists: validation
      still runs on the author model and is recorded as model_assessed, never as independent.
      coursebook_status reports the declared route in its `validator` block. The host's per-plugin
      llm trust gate (plugins.entries.coursebook.llm.allow_model_override / allowed_models) must
      also permit it.
  validator_provider:
    type: string
    default: ""
    description: >-
      Provider for validator_model when the second model lives behind a different provider. Read by
      __init__.py and passed to ctx.llm.complete_structured(provider=...). Empty keeps the host's
      configured provider. Gated by the host's
      plugins.entries.coursebook.llm.allow_provider_override / allowed_providers trust settings; a
      denied override fails the job loudly rather than silently reusing the author model.
