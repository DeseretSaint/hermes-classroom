12" font-weight="600" fill="#1a1713">A. Japanese L0 — field_atlas / lantern district</text><text x="320" y="82" font-family="ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif" font-size="12" font-weight="600" fill="#1a1713">B. Same plate, subject swapped to head gasket</text><text x="20" y="384" font-family="ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif" font-size="11" font-weight="400" fill="#5c5347">PASS only if the motifs, grammar and palette path change. A plate that still reads after the swap is REJECTED.</text><text x="20" y="404" font-family="ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif" font-size="11" font-weight="400" fill="#5c5347">Plate A: lantern + noren + cafe steam + counter. Plate B: gasket ring + pegboard wrench + manual spine + tray.</text><rect x="20" y="410" width="0" height="0" fill="#f7f1e4"/></svg>
