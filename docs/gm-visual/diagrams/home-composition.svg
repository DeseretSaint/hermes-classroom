<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img">
  <!-- GM-013 · global Home composition diagram, drawn 1:1 at a 1440 viewport.
       Annotated boxes and measurements only: no product copy beyond the labels the spec names.
       Colours are Atlas Lamp tokens; no gradient, no shadow. -->
  <rect width="1440" height="900" fill="#f7f1e4"/>

  <!-- content column guide -->
  <rect x="160" y="64" width="1120" height="649" fill="none" stroke="#d7cbb4" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="160" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1713">content column 1120 · gutters 32 · viewport 1440 × 900</text>

  <!-- header band -->
  <rect x="0" y="0" width="1440" height="64" fill="#f7f1e4"/>
  <rect x="0" y="64" width="1440" height="1" fill="#d7cbb4"/>
  <text x="160" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">brand mark + wordmark</text>
  <text x="560" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">Home · Courses · Workshop · Parent Studio</text>
  <text x="1280" y="40" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">settings</text>
  <text x="1290" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5c5347">64</text>

  <!-- invitation band -->
  <rect x="160" y="64" width="1120" height="320" fill="#fbebcb"/>
  <text x="720" y="150" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="34" font-weight="600" fill="#1a1713">What will you learn next?</text>
  <text x="720" y="186" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="19" fill="#5c5347">Pick a course, or chart a new one.</text>
  <rect x="610" y="216" width="220" height="48" rx="2" fill="#e8a93a"/>
  <text x="720" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1713">Start a new course</text>
  <text x="720" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2c4a8c">Browse the library</text>
  <text x="720" y="332" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5c5347">the one centred band · no illustration inside it · one filled control on the screen</text>
  <text x="1290" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5c5347">320</text>

  <!-- shelf head -->
  <text x="160" y="424" font-family="ui-serif, Georgia, serif" font-size="22" font-weight="600" fill="#1a1713">Your courses</text>
  <text x="1280" y="424" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2c4a8c">See all</text>

  <!-- cards: 260 wide, gap 16, cover 173, type block 88 -->
  <g>
    <rect x="160" y="452" width="260" height="261" fill="#fffcf3" stroke="#d7cbb4"/>
    <rect x="160" y="452" width="260" height="173" fill="#fbebcb" stroke="#d7cbb4"/>
    <rect x="160" y="506" width="260" height="24" fill="#e8a93a"/>
    <text x="176" y="654" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1a1713">course title</text>
    <text x="176" y="676" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">last touched / next section</text>
    <text x="176" y="700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1a1713">● GAME</text>
    <text x="404" y="700" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1a1713">Open</text>
  </g>
  <g>
    <rect x="436" y="452" width="260" height="261" fill="#fffcf3" stroke="#d7cbb4"/>
    <rect x="436" y="452" width="260" height="173" fill="#e2e8f7" stroke="#d7cbb4"/>
    <rect x="436" y="526" width="260" height="24" fill="#2c4a8c"/>
    <text x="452" y="654" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1a1713">course title</text>
    <text x="452" y="676" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">next section</text>
    <text x="452" y="700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1a1713">● TEXTBOOK</text>
  </g>
  <g>
    <rect x="712" y="452" width="260" height="261" fill="#fffcf3" stroke="#d7cbb4"/>
    <rect x="712" y="452" width="260" height="173" fill="#fbebcb" stroke="#d7cbb4"/>
    <rect x="712" y="546" width="260" height="24" fill="#e8a93a"/>
    <text x="728" y="654" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1a1713">course title</text>
    <text x="728" y="676" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">not started</text>
    <text x="728" y="700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1a1713">● GAME</text>
  </g>
  <g>
    <rect x="988" y="452" width="260" height="261" fill="#fffcf3" stroke="#d7cbb4"/>
    <rect x="988" y="452" width="260" height="173" fill="#e2e8f7" stroke="#d7cbb4"/>
    <text x="1004" y="654" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1a1713">course title</text>
    <text x="1004" y="676" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">last touched</text>
    <text x="1004" y="700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1a1713">● TEXTBOOK</text>
  </g>

  <!-- the clipped fifth card: 16px of shelf left inside the column -->
  <rect x="1264" y="452" width="16" height="261" fill="#fffcf3" stroke="#d7cbb4"/>

  <!-- fox plate standing on the ledge, right of the shelf, textless mark -->
  <g transform="translate(1300 651)">
    <path d="M0 64 L0 28 L13 16 L26 28 L39 16 L52 28 L52 64 Z" fill="#9c2e1c"/>
    <path d="M0 64 L52 64 L46 76 L6 76 Z" fill="#9c2e1c"/>
  </g>
  <text x="1300" y="700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5c5347">fox 64</text>
  <text x="1300" y="716" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5c5347">aria-hidden</text>

  <!-- ledge: 2px ink + 1px rule at 8px -->
  <rect x="0" y="713" width="1440" height="2" fill="#1a1713"/>
  <rect x="0" y="721" width="1440" height="1" fill="#d7cbb4"/>

  <!-- measurements -->
  <g stroke="#5c5347" stroke-width="1">
    <path d="M160 444 L160 438 M420 444 L420 438 M160 441 L420 441"/>
    <path d="M436 444 L436 438 M696 444 L696 438 M436 441 L696 441"/>
    <path d="M696 444 L712 444"/>
  </g>
  <text x="290" y="436" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#5c5347">260</text>
  <text x="566" y="436" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#5c5347">260</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5c5347">
    <text x="160" y="764">card 260 × 261 = cover 173 (3:2) + type block 88 · gap 16 · four full cards + a 16px sliver of the fifth at 1049</text>
    <text x="160" y="786">900: card 220 × 235, gap 12 · 460: min(78vw, 320), gap 12, fox hidden, track scrolls with snap</text>
    <text x="160" y="808">ledge: 2px ink rule + 1px rule at 8px. No wood texture, no shadow, no perspective, no bracket.</text>
    <text x="160" y="830">The fox stands on the ledge at the right edge and carries no state. It is not a second mascot and not a robot.</text>
    <text x="160" y="858" font-weight="600" fill="#1a1713">Forbidden here: star ratings, review counts, XP/NEW badges, a second create control, a course-bound Japanese hero.</text>
  </g>
</svg>
