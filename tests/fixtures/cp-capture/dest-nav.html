<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>CP-038 fixture: addressable destinations</title>
<style>
  html, body { margin: 0; background: #0d281b; }
  [data-cb-route] { width: 400px; min-height: 300px; background: #f7f1e4; color: #1b1b1b; }
</style>
</head>
<body>
  <!-- CP-038 fixture page. The route, its destinations and the click-through state are real DOM
       state, exactly like the plugin's `[data-cb-destination]` contract. Only the plugin sha is
       published through `window.__CP000_FIXTURE__`, so the live probe reads the DOM it would read
       in the rig. This is a test fixture, never evidence. -->
  <div data-cb-route="/coursebook" data-cb-scope="light" data-cb-destination="home"
       data-cb-v3-ready="true" data-cb-v3-textures="ready">
    <h1>Fixture surface</h1>
    <nav aria-label="Coursebook sections">
      <button type="button" data-cb-nav-item="home">Home</button>
      <button type="button" data-cb-nav-item="workshop">Workshop</button>
      <button type="button" data-cb-nav-item="courses">Courses</button>
      <button type="button" data-cb-nav-item="studio">Parent Studio</button>
    </nav>
    <article data-cb-course-id="course-1">
      <button type="button" data-cb-home-card-action="course-1">Open Course One</button>
    </article>
    <button type="button" data-cb-section-row="obj-1">Section one</button>
    <button type="button" data-cb-open-check>Open check</button>
    <div data-cb-course-home-slot></div>
    <div data-cb-lesson-slot></div>
    <div data-cb-scroll-region style="height:80px;overflow-y:auto;border-top:1px solid #ccc">
      <div style="height:800px">A long list that scrolls inside the route.</div>
    </div>
  </div>
  <div style="height: 2000px" aria-hidden="true"></div>
  <script>
    (() => {
      const route = document.querySelector('[data-cb-route]')
      const courseSlot = document.querySelector('[data-cb-course-home-slot]')
      const lessonSlot = document.querySelector('[data-cb-lesson-slot]')
      const reset = () => {
        courseSlot.removeAttribute('data-cb-course-home')
        lessonSlot.removeAttribute('data-cb-lesson-view')
        lessonSlot.removeAttribute('data-cb-document')
      }
      document.querySelectorAll('[data-cb-nav-item]').forEach((button) => {
        button.addEventListener('click', () => {
          reset()
          route.setAttribute('data-cb-destination', button.getAttribute('data-cb-nav-item'))
        })
      })
      document.querySelector('[data-cb-home-card-action]').addEventListener('click', () => {
        reset()
        courseSlot.setAttribute('data-cb-course-home', 'course-1')
      })
      document.querySelector('[data-cb-section-row]').addEventListener('click', () => {
        lessonSlot.setAttribute('data-cb-lesson-view', 'player')
        lessonSlot.setAttribute('data-cb-document', 'doc-1')
      })
      document.querySelector('[data-cb-open-check]').addEventListener('click', () => {
        route.setAttribute('data-cb-check-open', '1')
      })
    })()
    window.__CP000_FIXTURE__ = {
      plugin: {
        window_sha256: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
        loaded_path: '/tmp/fixture/plugin.js',
        bytes: 42,
        error: null
      }
    }
  </script>
</body>
</html>
