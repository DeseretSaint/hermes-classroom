<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>CP-038 fixture: destination control that does not route</title>
<style>
  html, body { margin: 0; background: #0d281b; }
  [data-cb-route] { width: 400px; min-height: 300px; background: #f7f1e4; color: #1b1b1b; }
</style>
</head>
<body>
  <!-- CP-038 fixture page. This is the CP-021 defect itself: a Workshop nav control exists and is
       clicked, but the rendered destination stays `home`. The door must refuse, not save the Home
       frame under a Workshop name. Records the click so a test can prove the control was used. -->
  <div data-cb-route="/coursebook" data-cb-scope="light" data-cb-destination="home"
       data-cb-v3-ready="true" data-cb-v3-textures="ready">
    <h1>Home surface</h1>
    <nav aria-label="Coursebook sections">
      <button type="button" data-cb-nav-item="home">Home</button>
      <button type="button" data-cb-nav-item="workshop">Workshop</button>
    </nav>
  </div>
  <script>
    document.querySelector('[data-cb-nav-item="workshop"]').addEventListener('click', () => {
      // The click lands, but the surface never changes — exactly the defect CP-038 exists to catch.
      document.querySelector('[data-cb-route]').setAttribute('data-cb-clicked-workshop', '1')
    })
    window.__CP000_FIXTURE__ = {
      plugin: {
        window_sha256: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
        loaded_path: '/tmp/fixture/plugin.js',
        bytes: 42,
        error: null
      }
    }
  </script>
</body>
</html>
