<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coursebook — Home scene reference</title>
<style>
  @font-face { font-family: 'CB Display'; src: url('../assets/fonts/CBDisplay-VF.woff2') format('woff2-variations'); font-weight: 100 900; }
  @font-face { font-family: 'CB UI'; src: url('../assets/fonts/CBUI-VF.woff2') format('woff2-variations'); font-weight: 100 900; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1344px; height: 768px; overflow: hidden; }
  body {
    position: relative;
    background: #f5e3c8;
    color: #1a1713;
    font-family: 'CB UI', system-ui, sans-serif;
  }
  .grain, .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .grain { background: url('../assets/art/material/paper-grain-light.png') repeat; background-size: 300px; opacity: .62; mix-blend-mode: multiply; }
  .vignette { background: url('../assets/art/material/parchment-vignette-light.png') center/cover no-repeat; opacity: .42; }

  header { position: absolute; top: 0; left: 0; right: 0; height: 86px; z-index: 5; }
  .brand { position: absolute; left: 94px; top: 30px; font-family: 'CB Display', Georgia, serif; font-size: 34px; font-weight: 600; color: #52301e; letter-spacing: -.8px; }
  nav { position: absolute; left: 388px; top: 42px; display: flex; gap: 102px; }
  nav a { font-size: 17px; color: #153220; text-decoration: none; padding-bottom: 4px; }
  nav a.active { border-bottom: 2px solid #b4532f; }
  .studio { position: absolute; left: 1102px; top: 40px; display: flex; align-items: center; gap: 12px; font-size: 17px; color: #1d3325; }
  .studio i { width: 32px; height: 32px; border: 1.5px solid #1d3325; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: 'CB Display', serif; font-size: 16px; }

  .hero { position: absolute; top: 128px; left: 0; right: 0; text-align: center; z-index: 4; }
  .hero h1 { margin: 0; font-family: 'CB Display', Georgia, serif; font-size: 64px; line-height: 1.02; font-weight: 600; color: #0d281b; letter-spacing: -0.02em; }
  .hero p { margin: 6px 0 0; font-size: 32.64px; line-height: 1.15; font-weight: 500; color: #1a1713; }
  .cta { margin-top: 30px; display: flex; gap: 24px; justify-content: center; }
  .btn { border: 0; border-radius: 999px; height: 48px; padding: 0 22px; font-family: inherit; font-size: 16px; font-weight: 600; color: #fffaf1; cursor: pointer; box-shadow: 0 2px 3px rgba(70,40,20,.18); }
  .btn.primary { background: #b4532f; }
  .btn.secondary { background: #b4532f; }

  .shelf { position: absolute; left: 273px; z-index: 3; }
  .shelf.cards { top: 384px; height: 175px; display: flex; gap: 24px; align-items: flex-end; }
  .card { width: 176px; height: 175px; transform-origin: 50% 100%; background: #f4ecd9; border-radius: 7px; box-shadow: 0 1px 1px rgba(58,35,24,.10), 0 6px 14px -8px rgba(58,35,24,.28); overflow: hidden; }
  .card .cover { height: 106px; width: 100%; object-fit: cover; display: block; }
  .card .body { padding: 8px 10px 10px; }
  .card h3 { margin: 0; font-size: 14px; line-height: 1.4; font-weight: 600; color: #1a1713; }
  .bar { margin-top: 9px; height: 5px; border-radius: 999px; background: rgba(90,60,35,.17); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: #a1741f; }

  .plank { position: absolute; z-index: 2; background: url('../assets/art/material/wood-plank-light.png') repeat-x; background-size: auto 100%; }
  .plank.one { left: 219px; width: 915px; top: 559px; height: 18px; border-bottom: 2px solid #7d5529; box-shadow: 0 7px 14px -5px rgba(55,30,15,.55); }
  .plank.one::after { content:''; position:absolute; left:0; right:0; top:18px; height:8px; background:#cdb894; border-bottom:1px solid #7d5529; }
  .plank.two { left: 130px; width: 1150px; top: 684px; height: 30px; }
  .plank.two::after { content:''; position:absolute; left:0; right:0; top:30px; height:24px; background:#a5763f; border-bottom:2px solid #7d5529; box-shadow: 0 10px 18px -6px rgba(45,25,12,.55); }

  .tag { position: absolute; left: 880px; top: 606px; width: 164px; height: 88px; background: #f4ecd9; border: 1.5px solid #1a1713; transform: rotate(-3deg); display: grid; place-items: center; font-family: 'CB Display', serif; font-size: 20px; color: #1a1713; z-index: 4; box-shadow: 0 1px 1px rgba(58,35,24,.10), 0 6px 14px -8px rgba(58,35,24,.28); }
  .tag::before { content: ''; position: absolute; left: 7px; right: 7px; top: 7px; bottom: 7px; border: 1px dashed #b9a888; }
  .clock { position: absolute; left: 1042px; top: 588px; width: 118px; height: 118px; z-index: 4; }
  .fox { position: absolute; left: 1088px; top: 526px; width: 208px; height: 208px; z-index: 5; }
  .bracket { position: absolute; top: 736px; width: 54px; height: 32px; background: #6b4826; clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); z-index: 1; }
  .bracket.l { left: 210px; }
  .bracket.r { right: 210px; }
  .cards .card:nth-child(1) { transform: rotate(-1.6deg); }
  .cards .card:nth-child(2) { transform: rotate(0.8deg); }
  .cards .card:nth-child(3) { transform: rotate(-0.6deg); }
  .cards .card:nth-child(4) { transform: rotate(1.4deg); }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="vignette"></div>

  <header>
    <div class="brand">Coursebook</div>
    <nav><a href="#" class="active">Home</a><a href="#">Discover Library</a></nav>
    <div class="studio"><i>C</i>Studio</div>
  </header>

  <section class="hero">
    <h1>Your field library</h1>
    <p>Choose a course or start a new expedition.</p>
    <div class="cta">
      <button class="btn primary">Start a new course</button>
      <button class="btn secondary">Browse library</button>
    </div>
  </section>

  <section class="shelf cards">
    <article class="card">
      <img class="cover" src="../bundled/packs/japanese-affection-context-l0/content/cover-4x5.png" alt="">
      <div class="body"><h3>Auto Repair Fundamentals</h3><div class="bar"><i style="width:62%"></i></div></div>
    </article>
    <article class="card">
      <img class="cover" src="../assets/art/scenes/course-map.png" alt="">
      <div class="body"><h3>Japanese Cafe Basics</h3><div class="bar"><i style="width:45%"></i></div></div>
    </article>
    <article class="card">
      <img class="cover" src="../bundled/packs/parent-measurement-practice/content/cover-4x5.png" alt="">
      <div class="body"><h3>Astronomy</h3><div class="bar"><i style="width:22%"></i></div></div>
    </article>
    <article class="card">
      <img class="cover" src="../bundled/packs/japanese-affection-context-l0/content/cover-3x2.png" alt="">
      <div class="body"><h3>Sourdough</h3><div class="bar"><i style="width:12%"></i></div></div>
    </article>
  </section>
  <div class="plank one"></div>

  <div class="tag">New course</div>
  <img class="clock" src="../assets/art/objects/clock.png" alt="">
  <img class="fox" src="../assets/art/fox/fox-clock-256.png" alt="">
  <div class="plank two"></div>
  <div class="bracket l"></div>
  <div class="bracket r"></div>
</body>
</html>
