# Draft catalog entry for Coursebook. Not submitted.
#
# The sha below is the commit this draft was validated against: the release skeleton commit
# that contains README.md and the install guide. It is a placeholder for the PR pin. Before the
# catalog pull request, merge every code change, then set sha to the release commit and version
# to the matching label in the same change. See docs/SUBMISSION.md sections 3 and 4.
name: coursebook
repo: https://github.com/DeseretSaint/hermes-classroom
sha: e1f1cab7087c19e8f4eacd09cc7dabf50633fee1
description: >-
  A native Hermes Desktop learning workspace where a lesson is governed state rather than chat:
  one objective at a time, typed checks, bounded grading, transactional transitions,
  inspectable evidence, and sourced visuals and audio, plus parent-prepared lesson packs.
  This 0.1.0 pin is the skeleton release: both halves load, the backend serves the frozen v1
  wire contract and reports health honestly, and every unimplemented command answers
  NOT_IMPLEMENTED, so no course can be created, graded or exported yet. Disclosure - the
  skeleton makes no network calls of its own and stores nothing; in the planned release, lesson
  chat reaches the selected chat provider and any configured external memory provider, planning
  and grading reach the configured auxiliary provider, research reaches configured search and
  fetch services and the named sites, image and speech reach their respective providers, state
  persists in profile-scoped SQLite under $HERMES_HOME, and pack export writes a local file and
  performs no upload. No telemetry, no credential storage, no self-update.
maintainer: DeseretSaint
title: Coursebook
tier: community
category: desktop
requires_hermes: ">=0.23.0"
version: "0.1.0"
docs_url: https://github.com/DeseretSaint/hermes-classroom/blob/e1f1cab7087c19e8f4eacd09cc7dabf50633fee1/docs/INSTALL.md
readme: true
platforms: []
known_issues:
  - "Skeleton release: no course creation, grading, export, Parent Studio or reminders yet; unimplemented commands return NOT_IMPLEMENTED."
  - "The SQLite schema is not migrated in this pin; the pane reports 'not migrated' instead of showing an empty course list."
capabilities:
  provides_tools:
    - coursebook_status
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
