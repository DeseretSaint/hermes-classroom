known_issues:
  - "No license file is present in this repository yet; do not redistribute until one is added (operator decision, board card t_6f2d2080)."
  - "Desktop route #/coursebook mounts against a reachable backend. A window with no gateway renders no route page for any hash (host shell degradation); CB-QA-09 was reclassified P3-operational, a one-gateway-per-host binding owned by the default profile, not a plugin defect. An isolated window therefore has no chat composer until the operator resolves the recording path."
  - "No demo is recorded; the demo gate is not met and no release tag exists. The plugin is not published to the catalog."
  - "Research runs inside plan jobs only; there is no standalone research command."
  - "Image and speech generation are implemented through the host's configured providers since M0 (3cead45), with text equivalents and honest degraded states, but the lesson-preview route is covered by tests rather than driven live on this tree. Pronunciation scoring ships as local practice-only scoring; it is not a graded or verified pronunciation assessment, and no provider key is read."
  - "Reminders are absent: no command, no job kind and no storage."
  - "The auxiliary open-response grader lane is disabled; closed checks are graded locally against a stored reference."
  - "A live Desktop window has not driven the merged release candidate; several views are proved by render and parity tests or by live captures on earlier commits."
