name: coursebook
repo: https://github.com/DeseretSaint/hermes-classroom
sha: 29bede7643403cd9d608499232125e6347c680dd
description: >-
  A native Hermes Desktop learning workspace where a lesson is governed state rather than chat:
  one objective at a time, typed checks, bounded grading, transactional transitions, inspectable
  evidence, and sourced visuals and audio, plus parent-prepared lesson packs. Coursebook 0.1.0
  holds no vendor credentials, makes no outbound HTTP request of its own and declares no required
  environment variables: every provider call goes through a seam the Hermes profile already
  configures. Disclosure - lesson chat reaches the selected chat provider and any configured
  external memory provider; plan and lesson generation, and Parent Studio planning, reach the host
  plugin LLM route with the goal or parent brief, dials, locale, bounded research queries and
  source excerpts; research reaches the host web_search and web_extract tools, so the configured
  search backend and the named sites; closed checks are graded locally against a stored reference;
  the auxiliary open-response grader lane is disabled, so an open answer is sent nowhere; image
  and speech generation are not implemented and no media provider is wired; state persists in
  profile-scoped SQLite under $HERMES_HOME; pack import reads a local file and pack export writes
  a local downloadable archive, and neither uploads; parent briefs require an acknowledged egress
  disclosure before a course is created. No telemetry, no usage reporting, no credential storage,
  no self-update.
maintainer: DeseretSaint
title: Coursebook
tier: community
category: desktop
requires_hermes: ">=0.23.0"
version: "0.1.0"
docs_url: https://github.com/DeseretSaint/hermes-classroom/blob/29bede7643403cd9d608499232125e6347c680dd/docs/INSTALL.md
readme: true
platforms: []
known_issues:
  - "Desktop route #/coursebook mounts against a reachable backend. A window with no gateway renders no route page for any hash (host shell degradation); CB-QA-09 was reclassified P3-operational, a one-gateway-per-host binding owned by the default profile, not a plugin defect. An isolated window therefore has no chat composer until the operator resolves the recording path."
  - "No license file is present in this repository yet; do not redistribute until one is added."
  - "Research runs inside plan jobs only; there is no standalone research command."
  - "Image and speech generation are absent: lesson generation emits declarative media specs with text equivalents and no provider is wired."
  - "Reminders are absent: no command, no job kind and no storage."
  - "The auxiliary open-response grader lane is disabled; closed checks are graded locally against a stored reference."
  - "evidence.inspect returns an open check's reference answer in the L2 projection (CB-QA-10); the UI does not render it."
capabilities:
